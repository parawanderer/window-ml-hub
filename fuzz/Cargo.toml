# Coverage-guided fuzzing (cargo-fuzz, nightly). Not a workspace member: it needs nightly and libFuzzer.
#   cargo +nightly fuzz run relay -- -max_total_time=60
# See docs/FUZZING.md.
[package]
name = "wmlhub-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = "1"
libfuzzer-sys = "0.4"
wmlhub-box = { path = "../crates/box", features = ["testing"] }
wmlhub-connector = { path = "../crates/connector" }
wmlhub-frame = { path = "../crates/frame" }
wmlhub-keys = { path = "../crates/keys" }
wmlhub-proto = { path = "../crates/proto" }
wmlhub-relay = { path = "../crates/relay", features = ["testing"] }
wmlhub-seal = { path = "../crates/seal" }

[workspace]
members = ["."]

[[bin]]
name = "relay"
path = "fuzz_targets/relay.rs"
test = false
doc = false
bench = false

[[bin]]
name = "frames"
path = "fuzz_targets/frames.rs"
test = false
doc = false
bench = false

[[bin]]
name = "frame_reader"
path = "fuzz_targets/frame_reader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "chain"
path = "fuzz_targets/chain.rs"
test = false
doc = false
bench = false

[[bin]]
name = "seal"
path = "fuzz_targets/seal.rs"
test = false
doc = false
bench = false

[[bin]]
name = "stream"
path = "fuzz_targets/stream.rs"
test = false
doc = false
bench = false

[[bin]]
name = "box_frame"
path = "fuzz_targets/box_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "http"
path = "fuzz_targets/http.rs"
test = false
doc = false
bench = false

[[bin]]
name = "revocation"
path = "fuzz_targets/revocation.rs"
test = false
doc = false
bench = false
