# A hub on the public internet with automatic HTTPS from Caddy (Let's Encrypt).
# Needs: a DNS record for WMLHUB_HUB_NAME pointing at this machine, and ports 80 and 443 open.
#   cp ../../.env.example .env   # set WMLHUB_HUB_NAME
#   docker compose up -d
#   docker compose exec hub wmlhub invite create
services:
  hub:
    build: ../..
    restart: unless-stopped
    environment:
      WMLHUB_HUB_NAME: ${WMLHUB_HUB_NAME:?set WMLHUB_HUB_NAME in .env}
      WMLHUB_REGISTRATION: ${WMLHUB_REGISTRATION:-invite}
      # Caddy is the only thing that reaches the hub here, and it sets X-Forwarded-For. Naming its network is what
      # lets the hub see the real client address, which turns the per-client connection rate on. Anything else you
      # put on this network could claim any address, so keep it to the proxy.
      WMLHUB_TRUSTED_PROXIES: ${WMLHUB_TRUSTED_PROXIES:-172.16.0.0/12}
    volumes:
      - wmlhub-data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      WMLHUB_HUB_NAME: ${WMLHUB_HUB_NAME}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  wmlhub-data:
  caddy-data:
