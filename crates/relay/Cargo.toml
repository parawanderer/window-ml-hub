[package]
name = "wmlhub-relay"
version = "0.1.0"
description = "The window.ml hub's routing core: accounts, streams, rings and backpressure, with no IO"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
arbitrary = { version = "1", features = ["derive"], optional = true }
wmlhub-proto = { path = "../proto" }

[dev-dependencies]
arbitrary = { version = "1", features = ["derive"] }

[features]
# The model checker (`model`), for the fuzz targets. Tests get it without the feature.
testing = ["dep:arbitrary"]

[lints]
workspace = true
