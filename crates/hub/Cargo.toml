[package]
name = "wmlhub"
version = "0.1.0"
description = "The window.ml hub: a websocket relay that reads envelopes and forwards ciphertext"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.4"
sha2 = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "time", "signal"] }
tokio-tungstenite = "0.30"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi"] }
wmlhub-keys = { path = "../keys" }
wmlhub-proto = { path = "../proto" }
wmlhub-relay = { path = "../relay" }

[lints]
workspace = true

[dev-dependencies]
wmlhub-keys = { path = "../keys" }
wmlhub-relay = { path = "../relay" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time"] }
